<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>

    <style>

<body class="bg-inform-navy text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-slate-950">
    
    <!-- Empty Header -->

        <div class="max-w-7xl mx-auto flex justify-between items-center">

    <footer class="w-full py-6 px-8 border-t border-white/5 text-center text-xs text-slate-500">
